<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dev With Spoon!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f2;--fg:#0a0a0a;--mut:#585858;--line:#cfcfcb;--hover:#eaeae6;--tile:#fff;--logo:#000}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--mut:#9a9a9a;--line:#2a2a2a;--hover:#121212;--tile:#161616;--logo:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.65 "Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:0 22px 40px}
.hero{text-align:center}
.banner{width:100%;height:210px;overflow:hidden;background:var(--tile)}
.banner img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
@media (min-width:700px){.banner{height:260px}}
.logo{position:relative;width:136px;height:136px;border-radius:50%;border:5px solid var(--bg);box-shadow:0 0 0 1px var(--logo);display:block;margin:-72px auto 22px;object-fit:cover}
h1{font:700 clamp(34px,9vw,46px)/1.1 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.tag{margin:12px auto 0;max-width:34ch;color:var(--mut)}
.prompt{font:400 14px "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--mut);margin:14px 0 0}
.prompt i{display:inline-block;width:.6em;height:1.05em;background:var(--fg);vertical-align:-.18em;margin-left:3px;animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
h2{font:500 14px "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--mut);margin:54px 0 14px}
.about p{margin:0 0 12px;max-width:62ch}
.about ul{margin:16px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.about li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.about li b{font-weight:500;min-width:112px}
.about li span{color:var(--mut)}
.links{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.links a{display:flex;align-items:center;gap:16px;padding:16px 8px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:background .15s,padding .15s}
.links a:hover,.links a:focus-visible{background:var(--hover);padding-left:16px;outline:none}
.links a:focus-visible{box-shadow:inset 0 0 0 2px var(--fg)}
.ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--tile);border:1px solid var(--line);display:grid;place-items:center}
.ic svg{width:24px;height:24px}
.tx{display:flex;flex-direction:column;min-width:0}
.tx b{font:500 18px/1.3 "Space Grotesk",system-ui,sans-serif}
.tx small{font-size:14px;line-height:1.4;color:var(--mut)}
.arr{margin-left:auto;font-family:"JetBrains Mono",monospace;color:var(--mut)}
footer{margin-top:64px;border-top:1px solid var(--line);padding:40px 22px 28px}
.f{max-width:600px;margin:0 auto}
.f-top{display:flex;flex-wrap:wrap;gap:32px 56px;justify-content:space-between}
.f-brand{max-width:290px}
.f-brand strong{font:700 20px "Space Grotesk",system-ui,sans-serif;letter-spacing:-.01em}
.f-brand p{margin:8px 0 0;color:var(--mut);font-size:14px;line-height:1.55}
.f-col h3{font:500 13px "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--mut);margin:0 0 10px}
.f-col a{display:block;color:inherit;text-decoration:none;padding:3px 0;font-size:15px}
.f-col a:hover{text-decoration:underline}
.f-col .soc{display:flex;flex-wrap:wrap;gap:8px;max-width:170px}
.f-col .soc a{display:grid;place-items:center;width:38px;height:38px;padding:0;border-radius:10px;background:var(--tile);border:1px solid var(--line)}
.f-col .soc a:hover{background:var(--hover);text-decoration:none}
.soc svg{width:18px;height:18px}
.f-bot{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;font:400 13px "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--mut)}
.f-bot a{color:inherit;text-decoration:none}
.f-bot a:hover{text-decoration:underline}
.err{margin:24px 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;color:var(--mut);font-size:14px}
@media (max-width:420px){.about li{flex-direction:column;gap:0}}
@media (prefers-reduced-motion:reduce){.prompt i{animation:none}.links a{transition:none}}
</style>
</head>
<body>
<div class="banner" id="top"><img id="banner" alt=""></div>
<main>
  <header class="hero">
    <img class="logo" id="logo" alt="">
    <h1 id="name"></h1>
    <p class="tag" id="tagline"></p>
    <p class="prompt" id="prompt"></p>
  </header>
  <p class="err" id="err" hidden>Couldn't load index.json. Open this page through a web server (for example run "python -m http.server" in this folder, or use VS Code Live Server) instead of opening the file directly.</p>
  <section class="about" id="about"></section>
  <section id="links"></section>
</main>
<footer>
  <div class="f">
    <div class="f-top">
      <div class="f-brand"><strong id="fName"></strong><p id="fBlurb"></p></div>
      <nav class="f-col" id="fNav" aria-label="Explore"></nav>
      <div class="f-col"><h3 id="fFollow"></h3><div class="soc" id="soc"></div></div>
    </div>
    <div class="f-bot"><span id="fCopy"></span><a href="#top" id="fTop"></a></div>
  </div>
</footer>

const $ = id => document.getElementById(id);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
function svgIcon(item) {
  const ic = ICONS[String(item.icon || "").toLowerCase()] || ICONS.link;
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
  s.setAttribute("fill", item.color || ic.c);
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", ic.d); s.appendChild(p); return s;
}
function ext(a, url) { a.href = url || "#"; if (/^https?:/i.test(url || "")) { a.target = "_blank"; a.rel = "noopener noreferrer"; } }

function render(c) {
  document.title = c.site.title; document.documentElement.lang = c.site.language || "en";
  if (c.site.favicon) {
    const l = document.createElement("link"); l.rel = "icon";
    l.href = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">' + c.site.favicon + '</text></svg>');
    document.head.appendChild(l);
  }
  $("banner").src = c.images.banner; $("logo").src = c.images.logo; $("logo").alt = c.hero.name + " logo";
  $("name").textContent = c.hero.name; $("tagline").textContent = c.hero.tagline;
  $("prompt").textContent = c.hero.prompt; $("prompt").appendChild(document.createElement("i"));

  const ab = $("about"); ab.append(el("h2", null, c.about.heading));
  c.about.paragraphs.forEach(t => ab.append(el("p", null, t)));
  if (c.about.highlights && c.about.highlights.length) {
    const ul = el("ul"); c.about.highlights.forEach(h => { const li = el("li"); li.append(el("b", null, h.title), el("span", null, h.text)); ul.append(li); });
    ab.append(ul);
  }

  const ls = $("links"); ls.append(el("h2", null, c.links.heading));
  const ul = el("ul", "links");
  c.links.items.forEach(it => {
    const li = el("li"), a = el("a"); ext(a, it.url); a.setAttribute("aria-label", it.name);
    const ic = el("span", "ic"); ic.append(svgIcon(it));
    const tx = el("span", "tx"); tx.append(el("b", null, it.name), el("small", null, it.description || ""));
    a.append(ic, tx, el("span", "arr", "→")); li.append(a); ul.append(li);
  });
  ls.append(ul);

  const f = c.footer;
  $("fName").textContent = c.hero.name; $("fBlurb").textContent = f.blurb;
  $("fNav").append(el("h3", null, f.exploreHeading));
  f.nav.forEach(n => { const a = el("a", null, n.label); a.href = n.href; $("fNav").append(a); });
  $("fFollow").textContent = f.followHeading;
  c.links.items.forEach(it => { const a = el("a"); ext(a, it.url); a.title = it.name; a.setAttribute("aria-label", it.name); a.append(svgIcon(it)); $("soc").append(a); });
  $("fCopy").textContent = f.copyright.replace("{year}", new Date().getFullYear());
  $("fTop").textContent = f.backToTop;
}

fetch("index.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(e => { console.error(e); $("err").hidden = false; });
</script>
</body>
</html>
